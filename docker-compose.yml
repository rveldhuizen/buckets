services:
  static-buckets:
    build: .
    image: local/buckets:1.0
    container_name: buckets
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in Portainer's environment variables}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - static-buckets-data:/data
    ports:
      - "8181:8080"
    networks:
      - npm_network

volumes:
  static-buckets-data:

networks:
  npm_network:
    external: true
    name: nginx-proxy-manager_default
