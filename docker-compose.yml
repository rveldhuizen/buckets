services:
  static-buckets:
    build: .
    image: local/static-buckets:1.0
    container_name: static-buckets
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in Portainer's environment variables}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - static-buckets-data:/data
    # Restrict this to 127.0.0.1 after placing the dashboard behind HTTPS.
    ports:
      - "8181:8080"
    networks:
      - frontend

volumes:
  static-buckets-data:

networks:
  proxy:
    external: true
    name: nginx-proxy-manager_default
